name: opspilot-replay

x-replay: &replay
  image: opspilot-replay:local
  build:
    context: ../..
  volumes:
    - replay_data:/data

services:
  api:
    <<: *replay
    ports:
      - "127.0.0.1:${OPSPILOT_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"
      interval: 3s
      timeout: 3s
      retries: 10
  worker:
    <<: *replay
    command: ["python", "-m", "opspilot.apps.worker.main"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  replay_data:
