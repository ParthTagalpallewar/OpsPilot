[project]
name = "opspilot"
version = "0.1.0"
description = "AI-powered incident investigation platform"
readme = "README.md"
authors = [
    { name = "Parth", email = "parth@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[project.optional-dependencies]
semantic = [
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.9",
]
postgres = [
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
]
redis = [
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
